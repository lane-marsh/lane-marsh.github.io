---

<style>
  .site-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    border-bottom: 1px solid #d1d5da;
    margin-bottom: 2rem;
  }

  .site-tabs button {
    padding: 0.65rem 1rem;
    border: 0;
    border-bottom: 3px solid transparent;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font: inherit;
  }

  .site-tabs button:hover,
  .site-tabs button:focus-visible,
  .site-tabs button[aria-selected="true"] {
    border-bottom-color: #267cb9;
  }

  .page-section {
    margin: 0 0 2.5rem;
  }
</style>

<h1>Lane Marsh</h1>
<h2>Engineer searching for employment in Sydney</h2>

<div class="site-tabs" role="tablist" aria-label="Page sections">
  <button id="about-tab" type="button" role="tab" aria-controls="about-panel" aria-selected="true" tabindex="0">About</button>
  <button id="experience-tab" type="button" role="tab" aria-controls="experience-panel" aria-selected="false" tabindex="-1">Experience</button>
  <button id="projects-tab" type="button" role="tab" aria-controls="projects-panel" aria-selected="false" tabindex="-1">projects</button>
  <button id="hobbies-tab" type="button" role="tab" aria-controls="hobbies-panel" aria-selected="false" tabindex="-1">Hobbies</button>
</div>

<section class="page-section" id="about-panel" role="tabpanel" aria-labelledby="about-tab" tabindex="0">
  {% include tabs/about.html %}
</section>

<section class="page-section" id="experience-panel" role="tabpanel" aria-labelledby="experience-tab" tabindex="0">
  {% include tabs/experience.html %}
</section>

<section class="page-section" id="projects-panel" role="tabpanel" aria-labelledby="projects-tab" tabindex="0">
  {% include tabs/projects.html %}
</section>

<section class="page-section" id="hobbies-panel" role="tabpanel" aria-labelledby="hobbies-tab" tabindex="0">
  {% include tabs/hobbies.html %}
</section>

<script>
  const tabs = Array.from(document.querySelectorAll('[role="tab"]'));

  function activateTab(tab) {
    tabs.forEach((item) => {
      const selected = item === tab;
      item.setAttribute('aria-selected', String(selected));
      item.tabIndex = selected ? 0 : -1;
      document.getElementById(item.getAttribute('aria-controls')).hidden = !selected;
    });
  }

  tabs.forEach((tab, index) => {
    tab.addEventListener('click', () => activateTab(tab));
    tab.addEventListener('keydown', (event) => {
      let nextIndex;

      if (event.key === 'ArrowRight') {
        nextIndex = (index + 1) % tabs.length;
      } else if (event.key === 'ArrowLeft') {
        nextIndex = (index - 1 + tabs.length) % tabs.length;
      } else if (event.key === 'Home') {
        nextIndex = 0;
      } else if (event.key === 'End') {
        nextIndex = tabs.length - 1;
      } else {
        return;
      }

      event.preventDefault();
      tabs[nextIndex].focus();
      activateTab(tabs[nextIndex]);
    });
  });

  activateTab(tabs[0]);
</script>
