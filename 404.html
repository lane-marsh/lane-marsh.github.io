<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --text-color: #1f2937;
            --light-text: #4b5563;
            --bg-color: #f9fafb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #60a5fa;
                --text-color: #f3f4f6;
                --light-text: #9ca3af;
                --bg-color: #111827;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 2rem;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            color: var(--primary-color);
            letter-spacing: -0.05em;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--light-text);
            font-size: 1.125rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--bg-color);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 0.375rem;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <p class="error-code">4 oh 4</p>
        <h1>Page Not Found</h1>
        <p>Not sure how you ended up here! Let's get back to why you should sponsor my working rights in Australia.</p>
        <a href="/" class="btn">Go Back Home</a>
    </div>

</body>
</html>
